# Single-instance beta. Review docs/BETA_LAUNCH.md before provisioning.
services:
  - type: web
    name: wikirace-beta
    runtime: node
    region: ohio
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WIKIRACE_DEPLOYMENT
        value: beta
      - key: WIKIRACE_EXTENSION_TARGET
        value: beta
      - key: WIKIRACE_TRUST_PROXY_HOPS
        value: "1"
      - key: WIKIRACE_SUPPORT_EMAIL
        value: jaxmerc03@gmail.com
      - key: WIKIRACE_OPERATOR_NAME
        value: WikiRace
      - key: DATABASE_URL
        fromDatabase:
          name: wikirace-beta-db
          property: connectionString
databases:
  - name: wikirace-beta-db
    region: ohio
    plan: basic-256mb
    databaseName: wikirace_beta
    user: wikirace
    postgresMajorVersion: "16"
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []
